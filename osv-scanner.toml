[[IgnoredVulns]]
id = "GHSA-v4x8-3wr5-3wq8"
ignoreUntil = 2026-11-20
reason = "the lock's Python 3.10 resolution stays on filelock 3.32.7 because the only fix, 4.2.1, is a new major that requires Python >= 3.11, and this advisory is in ReadWriteLock, which litellm never uses (only FileLock); Python 3.11+ resolves 4.2.4 via the uv overrides, so remove this once 3.10 is dropped"

[[IgnoredVulns]]
id = "GHSA-567q-5qvw-pf92"
ignoreUntil = 2026-11-20
reason = "Windows-only soft locks, including a FileLock that fell back to a soft lock, while litellm's CLI uses FileLock on local per-user paths where the OS lock primitive is available; the Python 3.10 resolution cannot take the 4.2.1 fix because it requires Python >= 3.11, and Python 3.11+ resolves 4.2.4 via the uv overrides"

