[[PackageOverrides]]
name = "dnspython"
version = "2.8.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-12-31
reason = "dnspython 2.9.0 requires Python >= 3.11, so the Python 3.10 resolution stays on 2.8.0; 3.11+ is on 2.9.0"

[[PackageOverrides]]
name = "filelock"
version = "3.32.7"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-12-31
reason = "the Python 3.10 resolution cannot take 4.2.1, which requires Python >= 3.11, and litellm only uses FileLock, not ReadWriteLock or AsyncReadWriteLock; Python 3.11+ resolves 4.2.4"

